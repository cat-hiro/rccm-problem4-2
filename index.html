<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>RCCM 問題4-2</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            overflow: auto;
            -webkit-overflow-scrolling: touch;
        }

        body {
            font-family: 'Hiragino Sans', 'Yu Gothic', sans-serif;
            line-height: 1.3;
            color: #333;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        .container {
            min-height: 115vh;
            display: flex;
            flex-direction: column;
            background: white;
        }

        .header {
            background: linear-gradient(135deg, #2c3e50, #3498db);
            color: white;
            padding: 15px;
            text-align: center;
            flex-shrink: 0;
        }

        .header h1 {
            font-size: 1.2em;
            margin-bottom: 5px;
        }

        .header p {
            font-size: 0.8em;
            opacity: 0.9;
        }

        .controls {
            padding: 8px 15px;
            background: #f8f9fa;
            border-bottom: 1px solid #e9ecef;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            flex-shrink: 0;
            font-size: 0.8em;
        }

        .year-selector {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .year-selector select {
            padding: 4px 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 12px;
            background: white;
        }

        .progress-info {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: bold;
            font-size: 0.75em;
        }

        .score {
            color: #27ae60;
        }

        .reset-btn {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.7em;
            cursor: pointer;
            font-weight: bold;
        }

        .reset-btn:hover {
            background: #c0392b;
        }

        .question-container {
            flex: 1;
            padding: 10px 15px;
            display: flex;
            flex-direction: column;
            min-height: 0;
            overflow: visible;
        }

        .question-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            padding-bottom: 6px;
            border-bottom: 1px solid #e9ecef;
            flex-shrink: 0;
        }

        .question-number {
            font-size: 1.0em;
            font-weight: bold;
            color: #2c3e50;
        }

        .question-year {
            background: #3498db;
            color: white;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 0.7em;
        }

        .question-text {
            font-size: 0.85em;
            line-height: 1.3;
            margin-bottom: 8px;
            padding: 8px;
            background: #f8f9fa;
            border-radius: 6px;
            border-left: 3px solid #3498db;
            white-space: pre-line;
            flex-shrink: 0;
            max-height: 120px;
            overflow-y: auto;
        }

        .choices {
            margin-bottom: 8px;
            flex-shrink: 0;
        }

        .choice {
            margin-bottom: 6px;
            padding: 8px;
            border: 1px solid #e9ecef;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
            background: white;
            font-size: 0.8em;
            line-height: 1.2;
        }

        .choice:hover {
            border-color: #3498db;
            background: #f0f8ff;
        }

        .choice.selected {
            border-color: #3498db;
            background: #e3f2fd;
        }

        .choice.correct {
            border-color: #27ae60;
            background: #d4edda;
        }

        .choice.incorrect {
            border-color: #e74c3c;
            background: #f8d7da;
        }

        .choice.disabled {
            cursor: not-allowed;
            opacity: 0.7;
        }

        .choice-label {
            font-weight: bold;
            color: #2c3e50;
            margin-right: 6px;
        }

        .result-area {
            margin-top: 8px;
            padding: 8px;
            border-radius: 6px;
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            display: none;
            flex: 1;
            min-height: 0;
        }

        .result-area.show {
            display: flex;
            flex-direction: column;
        }

        .result-status {
            font-size: 0.9em;
            font-weight: bold;
            margin-bottom: 6px;
            text-align: center;
            padding: 6px;
            border-radius: 4px;
            flex-shrink: 0;
        }

        .result-status.correct {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .result-status.incorrect {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .explanation {
            background: #fff3cd;
            border: 1px solid #ffeaa7;
            border-radius: 4px;
            padding: 6px;
            flex: 1;
            min-height: 0;
            display: flex;
            flex-direction: column;
        }

        .explanation h4 {
            color: #856404;
            margin-bottom: 4px;
            font-size: 0.8em;
            flex-shrink: 0;
        }

        .explanation-text {
            font-size: 0.75em;
            line-height: 1.3;
            flex: 1;
            overflow-y: auto;
        }

        .buttons {
            display: flex;
            justify-content: space-between;
            gap: 8px;
            margin-top: 8px;
            flex-shrink: 0;
        }

        .btn {
            padding: 6px 12px;
            border: none;
            border-radius: 4px;
            font-size: 0.8em;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
        }

        .btn-secondary {
            background: #95a5a6;
            color: white;
        }

        .btn-secondary:hover {
            background: #7f8c8d;
        }

        .btn-success {
            background: #27ae60;
            color: white;
        }

        .btn-success:hover {
            background: #229954;
        }

        .btn:disabled {
            background: #bdc3c7;
            cursor: not-allowed;
        }

        .result-summary {
            text-align: center;
            padding: 20px;
            background: #f8f9fa;
            margin: 10px;
            border-radius: 8px;
        }

        .result-summary h3 {
            color: #2c3e50;
            margin-bottom: 10px;
            font-size: 1.2em;
        }

        .result-score {
            font-size: 1.5em;
            font-weight: bold;
            margin: 10px 0;
        }

        .result-score.excellent {
            color: #27ae60;
        }

        .result-score.good {
            color: #f39c12;
        }

        .result-score.poor {
            color: #e74c3c;
        }

        .loading {
            text-align: center;
            padding: 40px;
            font-size: 1.0em;
            color: #666;
        }

        .completed-message {
            text-align: center;
            padding: 20px 15px;
            background: #d4edda;
            border: 2px solid #c3e6cb;
            border-radius: 8px;
            color: #155724;
            margin: 10px;
        }

        .completed-message h3 {
            margin-bottom: 10px;
            font-size: 1.1em;
        }

        .completed-message p {
            margin-bottom: 15px;
            font-size: 0.9em;
        }

        /* iPhone対応 */
        @media (max-width: 430px) {
            .header {
                padding: 10px;
            }
            
            .header h1 {
                font-size: 1.0em;
                margin-bottom: 3px;
            }
            
            .header p {
                font-size: 0.7em;
            }
            
            .question-text {
                max-height: 100px;
                font-size: 0.8em;
            }
            
            .choice {
                padding: 6px;
                margin-bottom: 4px;
                font-size: 0.75em;
            }
            
            .result-area {
                margin-top: 6px;
                padding: 6px;
            }
            
            .explanation-text {
                font-size: 0.7em;
            }
            
            .result-status {
                font-size: 0.8em;
                padding: 4px;
            }
        }
    
        /* --- Pull to Refresh (added) --- */
        
        #ptr-indicator.ptr-pull  { transform: translateY(60px); }
        #ptr-indicator.ptr-ready { transform: translateY(80px); }
    
    
/* --- Fixed nav padding & buttons (added) --- */
body{ padding-bottom: calc(84px + env(safe-area-inset-bottom)); }
#fixed-nav .fixed-btn{
  background: #eef2ff;
}
#fixed-nav .fixed-btn:active{
  transform: translateY(1px);
}

    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>RCCM 問題4-2</h1>
            <p>過去問題で実力アップ！（平成22年度〜令和元年度）</p>
        </div>

        <div class="controls">
            <div class="year-selector">
                <label for="yearSelect">年度:</label>
                <select id="yearSelect">
                    <option value="all">全年度</option>
                    <option value="2019">令和元年度</option>
                    <option value="2018">平成30年度</option>
                    <option value="2017">平成29年度</option>
                    <option value="2016">平成28年度</option>
                    <option value="2015">平成27年度</option>
                    <option value="2014">平成26年度</option>
                    <option value="2013">平成25年度</option>
                    <option value="2012">平成24年度</option>
                    <option value="2011">平成23年度</option>
                    <option value="2010">平成22年度</option>
                </select>
            </div>
            <div class="progress-info">
                <span>問題 <span id="currentQuestion">1</span> / <span id="totalQuestions">270</span></span>
                <span class="score">正解率: <span id="scorePercent">0</span>%</span>
                <button class="reset-btn" onclick="resetProgress()">リセット</button>
            </div>
        </div>

        <div class="question-container">
            <div class="loading" id="loading">
                問題を読み込み中...
            </div>

            <div id="questionContent" style="display:none;">
                <div class="question-header">
                    <div class="question-number" id="questionNumber">問題 1</div>
                    <div class="question-year" id="questionYear">平成22年度</div>
                </div>

                <div class="question-text" id="questionText">
                    問題を読み込み中...
                </div>

                <div class="choices" id="choices">
                </div>

                <div class="result-area" id="resultArea">
                    <div class="result-status" id="resultStatus"></div>
                    <div class="explanation" id="explanation">
                        <h4>📝 解説</h4>
                        <div class="explanation-text" id="explanationText"></div>
                    </div>
                </div>

                <div class="buttons">
                    <button class="btn btn-secondary" id="prevBtn" onclick="previousQuestion()">⬅️ 前の問題</button>
                    <button class="btn btn-success" id="nextBtn" onclick="nextQuestion()" style="display:none;">➡️ 次の問題</button>
                </div>
            </div>

            <div id="completedMessage" style="display:none;">
                <div class="completed-message">
                    <h3>🎉 全問題完了！</h3>
                    <p>すべての問題に正解しました！<br>「リセット」ボタンを押すと再び挑戦できます。</p>
                    <button class="btn btn-success" onclick="resetProgress()">🔄 リセットして再挑戦</button>
                </div>
            </div>

            <div class="result-summary" id="resultSummary" style="display:none;">
                <h3>🎉 お疲れさまでした！</h3>
                <div class="result-score" id="finalScore">80%</div>
                <p id="resultMessage">素晴らしい成績です！</p>
                <button class="btn btn-success" onclick="restartQuiz()">🔄 もう一度挑戦</button>
            </div>
        </div>
    </div>
<script src="data/all-questions-complete.js"></script>
    <script src="js/app.js"></script>

<script>
document.addEventListener('DOMContentLoaded', function(){
  const t = '過去問題で実力アップ！';
  const walker = document.createTreeWalker(document.body, NodeFilter.SHOW_ELEMENT, null);
  let n; const toRemove=[];
  while(n = walker.nextNode()){
    try{
      if(n && n.textContent && n.textContent.indexOf(t) !== -1){
        toRemove.push(n);
      }
    }catch(e){}
  }
  // remove only the smallest enclosing element that exactly contains the phrase (avoid nuking big sections)
  toRemove.forEach(el => {
    if (el.children.length===0 || (el.textContent||'').trim() === (t + '（平成22年度〜令和元年度）')){
      el.remove();
    } else {
      // try parent p/div
      if (el.closest('p')) el.closest('p').remove();
      else if (el.closest('div')) el.closest('div').remove();
    }
  });
});
</script>


<div id="fixed-nav" style="position:fixed;left:0;right:0;bottom:0;z-index:9999;display:flex;gap:8px;padding:8px 10px;box-sizing:border-box;background:rgba(255,255,255,0.95);backdrop-filter:saturate(180%) blur(8px);border-top:1px solid rgba(0,0,0,0.08);">
  <button id="btn-prev-fixed" class="fixed-btn" style="flex:1; height:72px; font-size:18px; border-radius:12px; border:none; box-shadow:0 2px 6px rgba(0,0,0,0.12);">◀ 前の問題</button>
  <button id="btn-next-fixed" class="fixed-btn" style="flex:1; height:72px; font-size:18px; border-radius:12px; border:none; box-shadow:0 2px 6px rgba(0,0,0,0.12);">次の問題 ▶</button>
</div>


<script>
(function(){
  function clickByText(txt){
    const candidates = Array.from(document.querySelectorAll('button, a, [role="button"]'));
    const el = candidates.find(e => (e.textContent||'').indexOf(txt) !== -1);
    if (el){ el.click(); return true; }
    return false;
  }
  function goPrev(){
    if (typeof window.goPrev === 'function') { window.goPrev(); return; }
    if (typeof window.prevQuestion === 'function') { window.prevQuestion(); return; }
    if (!clickByText('前の問題')) clickByText('前へ');
  }
  function goNext(){
    if (typeof window.goNext === 'function') { window.goNext(); return; }
    if (typeof window.nextQuestion === 'function') { window.nextQuestion(); return; }
    if (!clickByText('次の問題')) clickByText('次へ');
  }
  document.getElementById('btn-prev-fixed').addEventListener('click', goPrev);
  document.getElementById('btn-next-fixed').addEventListener('click', goNext);
})();
</script>

</body>
</html>
